<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conquista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23164551'/><path d='M8 22 L16 8 L24 22 Z' fill='%23c9a24b'/></svg>">
</head>
<body>
  <!-- Landing / lobby -->
  <section id="screen-home" class="screen">
    <div class="home-card">
      <h1 class="wordmark">Conquista</h1>
      <p class="tagline">Divide the world among 2–6 friends. Hold it with dice and nerve.</p>

      <div id="home-entry">
        <label class="field">
          <span>Your name</span>
          <input id="in-name" maxlength="18" autocomplete="nickname" placeholder="e.g. Benjamin">
        </label>
        <button id="btn-create" class="btn btn-brass btn-wide">Create a game</button>
        <div class="or"><span>or join a friend</span></div>
        <div class="join-row">
          <input id="in-code" maxlength="5" placeholder="Room code" autocomplete="off" spellcheck="false">
          <button id="btn-join" class="btn">Join</button>
        </div>
      </div>

      <div id="lobby" hidden>
        <div class="lobby-head">
          <div>
            <div class="muted small">Room code</div>
            <div id="lobby-code" class="room-code"></div>
          </div>
          <button id="btn-copy" class="btn btn-ghost">Copy invite link</button>
        </div>
        <ul id="lobby-players" class="lobby-players"></ul>
        <div class="field">
          <span>Your colour</span>
          <div id="color-swatches" class="swatches"></div>
        </div>
        <fieldset id="lobby-settings" class="settings">
          <div class="field">
            <span>Victory</span>
            <div class="seg" id="seg-mode">
              <button data-mode="domination">World domination</button>
              <button data-mode="missions">Secret missions</button>
            </div>
          </div>
          <label class="field">
            <span>Turn timer</span>
            <select id="sel-timer">
              <option value="0">No timer</option>
              <option value="60">60 seconds</option>
              <option value="90">90 seconds</option>
              <option value="120">2 minutes</option>
              <option value="180">3 minutes</option>
              <option value="300">5 minutes</option>
            </select>
          </label>
        </fieldset>
        <p id="lobby-hint" class="muted small"></p>
        <div class="lobby-actions">
          <button id="btn-leave" class="btn btn-ghost">Leave</button>
          <button id="btn-start" class="btn btn-brass">Start game</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <div class="wordmark small-mark">Conquista</div>
      <div id="turn-banner" class="turn-banner"></div>
      <div class="topbar-right">
        <span id="timer" class="timer" hidden></span>
        <button id="btn-names" class="btn btn-ghost btn-sm" title="Always show territory names (they also appear when you zoom in)">Names</button>
        <span class="muted small">Room <strong id="game-code"></strong></span>
        <button id="btn-leave-game" class="btn btn-ghost btn-sm" title="Leave this game and go back to the start screen">Leave</button>
      </div>
    </header>

    <div class="layout">
      <aside class="rail rail-left">
        <div id="power" class="power"></div>
        <div id="threat-note" class="threat-note" hidden></div>
        <h2 class="rail-title">Commanders</h2>
        <ul id="player-list" class="player-list"></ul>
        <div id="mission-box" class="mission" hidden>
          <div class="mission-label">Your secret mission</div>
          <p id="mission-text"></p>
        </div>
        <details class="legend" open>
          <summary>Continent bonuses</summary>
          <ul id="continent-list"></ul>
        </details>
      </aside>

      <main class="board-wrap">
        <svg id="board" role="img" aria-label="World map"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
        <div class="zoom-ctrl" role="group" aria-label="Map zoom">
          <button id="zoom-in" class="btn btn-sm" title="Zoom in (or scroll)" aria-label="Zoom in">+</button>
          <button id="zoom-out" class="btn btn-sm" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoom-fit" class="btn btn-sm" title="Show the whole world">Fit</button>
        </div>
      </main>

      <aside class="rail rail-right">
        <div id="action-panel" class="panel"></div>
        <div id="dice-panel" class="dice-panel" hidden></div>
        <div class="panel cards-panel">
          <div class="panel-head">
            <h2 class="rail-title">Your cards</h2>
            <span id="trade-value" class="muted small"></span>
          </div>
          <div id="hand" class="hand"></div>
          <button id="btn-trade" class="btn btn-sm" disabled>Trade in set</button>
        </div>
        <div class="panel log-panel">
          <h2 class="rail-title">Dispatches</h2>
          <ol id="log" class="log"></ol>
          <form id="chat-form" class="chat-form">
            <input id="chat-in" maxlength="200" placeholder="Message the table" autocomplete="off">
          </form>
        </div>
      </aside>
    </div>

    <div id="gameover" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="go-title" class="go-title"></h2>
        <p id="go-sub" class="muted"></p>
        <ul id="go-missions" class="go-missions"></ul>
        <div class="lobby-actions">
          <button id="btn-view-board" class="btn btn-ghost">View board</button>
          <button id="btn-rematch" class="btn btn-brass">Back to lobby</button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/shared/map-geo.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
