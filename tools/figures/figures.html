<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#888">
<script src="../../node_modules/three/build/three.min.js"></script>
<script>
// Army figures for the board (infantry, horseman, cannon), modelled from simple shapes and rendered as
// matte painted miniatures, one sprite per player colour. Run tools/build-figures.js to regenerate.
const SIZE = 384;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const M = (geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], scale) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  if (scale) m.scale.set(...scale);
  m.castShadow = true; m.receiveShadow = true;
  return m;
};
const cyl = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, seg);
// a cylinder from point a to point b
function limb(mat, a, b, r1, r2 = r1) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const len = A.distanceTo(B);
  const m = M(cyl(r2, r1, len, 16), mat);
  m.position.copy(A.clone().add(B).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  return m;
}
const joint = (mat, p, r) => M(new THREE.SphereGeometry(r, 16, 12), mat, p);


// helpers for smoother, more anatomical shapes
const sph = (mat, p, r, sc) => M(new THREE.SphereGeometry(r, 24, 18), mat, p, [0, 0, 0], sc);
function base(g, mat, sx = 1) {
  g.add(M(cyl(0.23, 0.245, 0.06, 48), mat.dark, [0, 0.03, 0], [0, 0, 0], [sx, 1, 1]));
  g.add(M(cyl(0.225, 0.23, 0.012, 48), mat, [0, 0.066, 0], [0, 0, 0], [sx, 1, 1]));
}
function soldierBody(g, mat, y0, opts = {}) {
  // legs (two segments each, slight stride)
  const hipY = y0 + 0.40;
  g.add(limb(mat, [-0.06, hipY, 0], [-0.07, y0 + 0.2, 0.03], 0.048, 0.042));
  g.add(limb(mat, [-0.07, y0 + 0.2, 0.03], [-0.07, y0 + 0.03, 0.0], 0.042, 0.036));
  g.add(limb(mat, [0.06, hipY, 0], [0.07, y0 + 0.2, -0.03], 0.048, 0.042));
  g.add(limb(mat, [0.07, y0 + 0.2, -0.03], [0.075, y0 + 0.03, -0.02], 0.042, 0.036));
  g.add(sph(mat.dark, [-0.07, y0 + 0.025, 0.03], 0.042, [0.9, 0.55, 1.6]));
  g.add(sph(mat.dark, [0.075, y0 + 0.025, 0.01], 0.042, [0.9, 0.55, 1.6]));
  // coat with tails
  g.add(M(cyl(0.105, 0.125, 0.12, 28), mat, [0, hipY + 0.02, 0]));
  g.add(M(new THREE.BoxGeometry(0.16, 0.2, 0.02), mat, [0, hipY - 0.07, -0.1], [0.18, 0, 0]));
  g.add(M(cyl(0.118, 0.1, 0.26, 28), mat, [0, hipY + 0.19, 0], [0, 0, 0], [1, 1, 0.82])); // torso
  // crossbelts and waist belt
  for (const sgn of [1, -1]) g.add(M(new THREE.BoxGeometry(0.03, 0.34, 0.012), mat.light, [0, hipY + 0.18, 0.093], [0, 0, sgn * 0.62]));
  g.add(M(new THREE.TorusGeometry(0.108, 0.012, 8, 32), mat.light, [0, hipY + 0.07, 0], [Math.PI / 2, 0, 0], [1, 0.82, 1]));
  if (opts.pack !== false) g.add(M(new THREE.BoxGeometry(0.17, 0.15, 0.07), mat.dark, [0, hipY + 0.22, -0.12])); // backpack
  // shoulders, epaulettes
  const shY = hipY + 0.3;
  for (const x of [-0.125, 0.125]) { g.add(sph(mat, [x, shY, 0], 0.045)); g.add(sph(mat.light, [x, shY + 0.02, 0], 0.035, [1.3, 0.45, 1.1])); }
  // head + collar
  g.add(M(cyl(0.05, 0.06, 0.05, 20), mat, [0, shY + 0.04, 0]));
  g.add(sph(mat, [0, shY + 0.11, 0.005], 0.062, [0.95, 1.08, 1]));
  return { hipY, shY, headY: shY + 0.11 };
}

function infantry(mat) {
  const g = new THREE.Group();
  base(g, mat);
  const { shY, headY } = soldierBody(g, mat, 0.07);
  // tall bearskin
  g.add(M(cyl(0.062, 0.07, 0.17, 28), mat.dark, [0, headY + 0.12, -0.004]));
  g.add(sph(mat.dark, [0, headY + 0.205, -0.004], 0.062, [1, 0.55, 1]));
  g.add(sph(mat.light, [0.05, headY + 0.2, 0.02], 0.014));
  // arms: left down, right gripping musket at shoulder
  g.add(limb(mat, [-0.13, shY, 0], [-0.15, shY - 0.17, 0.02], 0.038, 0.034));
  g.add(limb(mat, [-0.15, shY - 0.17, 0.02], [-0.14, shY - 0.31, 0.05], 0.034, 0.03));
  g.add(limb(mat, [0.13, shY, 0], [0.16, shY - 0.17, 0.04], 0.038, 0.034));
  g.add(limb(mat, [0.16, shY - 0.17, 0.04], [0.15, shY - 0.1, 0.11], 0.034, 0.03));
  // musket with bayonet held upright
  g.add(limb(mat.dark, [0.175, 0.1, 0.1], [0.165, shY + 0.32, 0.1], 0.017, 0.013));
  g.add(limb(mat.dark, [0.175, 0.1, 0.1], [0.172, 0.33, 0.1], 0.03, 0.022));
  g.add(limb(mat.light, [0.165, shY + 0.32, 0.1], [0.163, shY + 0.45, 0.1], 0.007, 0.002));
  return g;
}

function horseman(mat) {
  const g = new THREE.Group();
  base(g, mat, 1.7);
  const H = 0.07;
  // horse body: barrel + chest + rump, muscular
  g.add(M(new THREE.CapsuleGeometry(0.115, 0.3, 10, 24), mat, [0, H + 0.42, 0], [0, 0, Math.PI / 2], [1, 1, 0.88]));
  g.add(sph(mat, [0.2, H + 0.43, 0], 0.13, [1, 1.05, 0.85]));   // chest
  g.add(sph(mat, [-0.19, H + 0.45, 0], 0.13, [1.05, 1, 0.92])); // rump
  // legs: upper thick + lower slim + hoof; front-left raised (prancing)
  const leg = (x, z, kneeOff, footX, lift = 0) => {
    g.add(limb(mat, [x, H + 0.38, z], [x + kneeOff, H + 0.2 + lift, z], 0.045, 0.03));
    g.add(limb(mat, [x + kneeOff, H + 0.2 + lift, z], [footX, H + 0.03 + lift * 1.4, z], 0.026, 0.022));
    g.add(M(cyl(0.026, 0.032, 0.03, 14), mat.dark, [footX, H + 0.015 + lift * 1.4, z]));
  };
  leg(0.2, 0.07, 0.03, 0.22);
  leg(0.2, -0.07, 0.1, 0.24, 0.1);
  leg(-0.2, 0.07, -0.04, -0.21);
  leg(-0.2, -0.07, 0.0, -0.17);
  // neck (tapered, arched) and head
  g.add(limb(mat, [0.22, H + 0.48, 0], [0.31, H + 0.68, 0], 0.085, 0.055));
  g.add(M(new THREE.CapsuleGeometry(0.045, 0.13, 8, 16), mat, [0.36, H + 0.68, 0], [0, 0, -1.15], [1, 1, 0.85]));
  g.add(sph(mat, [0.42, H + 0.635, 0], 0.035, [1, 0.9, 0.8]));   // muzzle
  for (const z of [0.022, -0.022]) g.add(M(new THREE.ConeGeometry(0.014, 0.045, 10), mat, [0.31, H + 0.76, z], [0, 0, -0.25]));
  g.add(M(new THREE.BoxGeometry(0.2, 0.035, 0.024), mat.dark, [0.255, H + 0.66, 0], [0, 0, 1.05])); // mane
  // tail: flowing curve
  g.add(limb(mat.dark, [-0.3, H + 0.5, 0], [-0.36, H + 0.36, 0], 0.03, 0.035));
  g.add(limb(mat.dark, [-0.36, H + 0.36, 0], [-0.35, H + 0.2, 0], 0.035, 0.018));
  // saddle cloth
  g.add(M(new THREE.BoxGeometry(0.2, 0.012, 0.25), mat.light, [-0.02, H + 0.545, 0], [0, 0, -0.05]));
  // rider: hips, legs along flanks, torso, shako, sabre raised
  const rY = H + 0.56;
  g.add(M(cyl(0.085, 0.095, 0.08, 24), mat, [-0.02, rY + 0.03, 0]));
  for (const z of [0.1, -0.1]) {
    g.add(limb(mat, [-0.02, rY + 0.03, z * 0.8], [0.05, rY - 0.1, z * 1.15], 0.04, 0.034));
    g.add(limb(mat, [0.05, rY - 0.1, z * 1.15], [0.03, rY - 0.24, z * 1.2], 0.034, 0.028));
    g.add(sph(mat.dark, [0.05, rY - 0.25, z * 1.2], 0.03, [1.5, 0.6, 0.9]));
  }
  g.add(M(cyl(0.095, 0.085, 0.22, 24), mat, [-0.03, rY + 0.17, 0], [0, 0, -0.06], [1, 1, 0.85]));
  for (const sgn of [1, -1]) g.add(M(new THREE.BoxGeometry(0.026, 0.27, 0.01), mat.light, [-0.025, rY + 0.17, 0.075], [0, 0, sgn * 0.6]));
  const sh = rY + 0.28;
  for (const z of [0.11, -0.11]) g.add(sph(mat.light, [-0.02, sh + 0.01, z], 0.032, [1.1, 0.45, 1.3]));
  g.add(M(cyl(0.045, 0.05, 0.05, 16), mat, [-0.02, sh + 0.03, 0]));
  g.add(sph(mat, [-0.015, sh + 0.095, 0], 0.056, [0.95, 1.08, 1]));
  g.add(M(cyl(0.06, 0.055, 0.11, 24), mat.dark, [-0.015, sh + 0.19, 0]));       // shako
  g.add(M(cyl(0.066, 0.066, 0.012, 24), mat.dark, [-0.015, sh + 0.247, 0]));
  g.add(M(new THREE.ConeGeometry(0.014, 0.08, 10), mat.light, [-0.02, sh + 0.29, 0.03]));  // plume
  // reins arm forward, sabre arm raised high
  g.add(limb(mat, [-0.02, sh, 0.11], [0.08, sh - 0.12, 0.12], 0.032, 0.028));
  g.add(limb(mat, [-0.02, sh, -0.11], [0.03, sh + 0.13, -0.15], 0.032, 0.028));
  g.add(limb(mat.light, [0.04, sh + 0.14, -0.15], [0.17, sh + 0.42, -0.17], 0.009, 0.004)); // sabre blade
  g.add(M(new THREE.TorusGeometry(0.02, 0.005, 6, 12), mat.dark, [0.04, sh + 0.14, -0.15]));
  g.position.x = -0.03;
  return g;
}

function cannon(mat) {
  const g = new THREE.Group();
  const W = mat.dark;
  // carriage: two angled cheek plates joined by transoms, long trail to the ground
  for (const z of [-0.07, 0.07]) {
    g.add(M(new THREE.BoxGeometry(0.34, 0.11, 0.025), W, [0.0, 0.26, z], [0, 0, 0.12]));
    g.add(M(new THREE.BoxGeometry(0.42, 0.06, 0.025), W, [-0.3, 0.14, z * 0.6], [0, 0, 0.38]));
  }
  g.add(M(new THREE.BoxGeometry(0.06, 0.05, 0.15), W, [-0.1, 0.22, 0]));
  g.add(M(new THREE.BoxGeometry(0.12, 0.03, 0.09), W, [-0.5, 0.04, 0]));          // trail spade
  g.add(M(cyl(0.022, 0.022, 0.44, 12), W, [0.06, 0.21, 0], [Math.PI / 2, 0, 0]));  // axle
  // barrel: tapered with reinforcing rings, muzzle swell, cascabel
  const barrel = new THREE.Group();
  barrel.add(M(cyl(0.055, 0.082, 0.62, 32), mat, [0, 0, 0], [0, 0, -Math.PI / 2]));
  barrel.add(M(cyl(0.066, 0.06, 0.05, 32), mat, [0.32, 0, 0], [0, 0, -Math.PI / 2]));
  for (const [x, r] of [[0.06, 0.07], [-0.14, 0.086], [-0.29, 0.088]]) barrel.add(M(new THREE.TorusGeometry(r, 0.01, 8, 32), mat, [x, 0, 0], [0, Math.PI / 2, 0]));
  barrel.add(sph(mat, [-0.33, 0, 0], 0.07, [0.5, 1, 1]));
  barrel.add(sph(mat, [-0.385, 0, 0], 0.024));
  barrel.add(M(cyl(0.022, 0.022, 0.2, 12), mat, [-0.04, 0, 0], [Math.PI / 2, 0, 0]));
  barrel.position.set(0.1, 0.36, 0); barrel.rotation.z = 0.14;
  g.add(barrel);
  // large spoked wheels with iron tyres
  for (const z of [-0.2, 0.2]) {
    const w = new THREE.Group();
    w.add(M(new THREE.TorusGeometry(0.2, 0.022, 10, 48), W));
    w.add(M(new THREE.TorusGeometry(0.2, 0.012, 8, 48), mat.light, [0, 0, z > 0 ? 0.012 : -0.012]));
    w.add(M(cyl(0.045, 0.05, 0.08, 20), W, [0, 0, 0], [Math.PI / 2, 0, 0]));
    for (let i = 0; i < 12; i++) w.add(M(new THREE.BoxGeometry(0.014, 0.36, 0.014), W, [0, 0, 0], [0, 0, i * Math.PI / 12]));
    w.position.set(0.06, 0.21, z);
    g.add(w);
  }
  g.scale.setScalar(1.08);
  return g;
}

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x2a2014, 0.65));
const key = new THREE.DirectionalLight(0xfff1dc, 3.1);
key.position.set(-0.9, 5, 1.6); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -1; key.shadow.camera.right = 1; key.shadow.camera.top = 1; key.shadow.camera.bottom = -1;
key.shadow.radius = 6; key.shadow.bias = -0.002;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(2, 1.5, -2.5); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; // (no ground shadow: drawn on the map instead)

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20);
camera.position.set(1.7, 1.9, 2.5);
camera.lookAt(0, 0.5, 0);

// crop to the figure and scale to a fixed height (2x the largest on-screen size, for sharp zoom)
const OUT_H = { inf: 120, cav: 128, art: 80 };
let curKind = 'inf';
function crop(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++) for (let i = 0; i < c.width; i++) if (d[(y * c.width + i) * 4 + 3] > 8) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const w = x1 - x0 + 1, h = y1 - y0 + 1, H = OUT_H[curKind], W = Math.round(w * H / h);
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high'; ox.drawImage(c, x0, y0, w, h, 0, 0, W, H);
  return { url: o.toDataURL('image/png'), w: W, h: H };
}
window.renderAll = (colors) => {
  const out = {};
  for (const [kind, build] of Object.entries({ inf: infantry, cav: horseman, art: cannon })) {
    curKind = kind;
    for (const c of colors) {
      const col = new THREE.Color(c);
      const mk = (cc) => new THREE.MeshStandardMaterial({ color: cc, roughness: 0.72, metalness: 0.0 });
      const mat = mk(col);
      mat.dark = mk(col.clone().multiplyScalar(0.62));   // boots, hats, wood: a darker shade of the same plastic
      mat.light = mk(col.clone().lerp(new THREE.Color(0xffffff), 0.16)); // belts, trim
      const fig = build(mat);
      scene.add(fig);
      renderer.render(scene, camera);
      out[`${kind}-${c.slice(1)}`] = crop(renderer.domElement);
      scene.remove(fig);
    }
  }
  return out;
};
</script></body></html>
